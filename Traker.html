<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRAKER ZARD | Global On-Chain Suite</title>
    
    <!-- Metaetiquetas Open Graph -->
    <meta property="og:title" content="TRAKER ZARD | Protocolo Oficial 🚀">
    <meta property="og:description" content="Monitoreo Técnico On-Chain en Tiempo Real. Ecosistema ZAARD.">
    <meta property="og:image" content="https://raw.githubusercontent.com/figueredo56/zaard-tracker/refs/heads/main/189%20sin%20t%C3%ADtulo_20260720005119_1.png">
    <meta property="og:url" content="https://figueredo56.github.io/zaard-tracker/">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#00ffff',
                            purple: '#a855f7',
                            emerald: '#22c55e',
                            darkBg: '#050014'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            background: #030008;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 8px;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .main-frame {
            border: 1px solid rgba(0, 255, 255, 0.25);
            border-radius: 14px;
            background: #06040f;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
            width: 100%;
        }

        .title-gradient {
            background: linear-gradient(135deg, #00ffff 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .clean-card {
            background: rgba(12, 10, 25, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.15);
        }

        .banner-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.3);
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .banner-container img {
            width: 100%;
            height: auto;
            max-height: 120px;
            object-fit: cover;
            display: block;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #030008;
        }
        ::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="main-container py-2">
        <div class="main-frame p-3 flex flex-col items-center gap-2.5">
            
            <!-- 1. PORTADA SUPERIOR -->
            <div class="banner-container">
                <img src="https://raw.githubusercontent.com/figueredo56/zaard-tracker/refs/heads/main/189%20sin%20t%C3%ADtulo_20260720005119_1.png" alt="Portada ZARD">
            </div>

            <!-- TÍTULO Y SUBTÍTULO -->
            <div class="text-center w-full">
                <h1 class="text-lg sm:text-xl font-extrabold title-gradient uppercase tracking-wider" data-i18n="mainTitle">TRAKER ZARD</h1>
                <p class="text-[10px] text-gray-400" data-i18n="mainSubtitle">Monitoreo On-Chain - Ecosistema ZAARD</p>
            </div>

            <!-- BANDERAS DE IDIOMA -->
            <div class="flex justify-center items-center gap-1 w-full">
                <div class="flex items-center gap-1 bg-black/85 border border-cyan-500/20 rounded-md p-0.5">
                    <button onclick="changeLanguage('es')" id="btn-es" class="flex items-center gap-1 px-2 py-0.5 text-[11px] font-bold rounded transition-all bg-cyan-500 text-black">
                        <span>🇪🇸</span> <span>ES</span>
                    </button>
                    <button onclick="changeLanguage('en')" id="btn-en" class="flex items-center gap-1 px-2 py-0.5 text-[11px] font-bold rounded transition-all text-gray-400 hover:text-white bg-transparent">
                        <span>🇬🇧</span> <span>EN</span>
                    </button>
                    <button onclick="changeLanguage('ar')" id="btn-ar" class="flex items-center gap-1 px-2 py-0.5 text-[11px] font-bold rounded transition-all text-gray-400 hover:text-white bg-transparent">
                        <span>🇸🇦</span> <span>AR</span>
                    </button>
                    <button onclick="changeLanguage('zh')" id="btn-zh" class="flex items-center gap-1 px-2 py-0.5 text-[11px] font-bold rounded transition-all text-gray-400 hover:text-white bg-transparent">
                        <span>🇨🇳</span> <span>ZH</span>
                    </button>
                </div>
            </div>

            <!-- 2. TARJETA DEL TOKEN CON LOGO PEQUEÑO Y BOTÓN AL LADO EXACTO -->
            <a id="token-link" href="#" target="_blank" class="w-full clean-card rounded-lg p-2.5 flex items-center justify-between gap-2 group shadow-sm hover:border-cyan-400 transition-all">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-8 h-8 rounded-full border border-cyan-400/50 p-0.5 bg-black flex items-center justify-center shrink-0 overflow-hidden">
                        <img src="https://raw.githubusercontent.com/figueredo56/zaard-tracker/refs/heads/main/184%20sin%20t%C3%ADtulo_20260715225022.png" alt="Logo ZARD" class="w-full h-full object-cover rounded-full">
                    </div>
                    <div class="flex flex-col text-left min-w-0">
                        <span class="text-[11px] font-bold text-cyan-200 truncate" data-i18n="officialToken">Token Oficial ZARD</span>
                        <span class="text-[9px] text-gray-400 truncate">Binance Web3 Suite</span>
                    </div>
                </div>
                <span class="bg-cyan-500 hover:bg-cyan-400 text-black text-[10px] font-bold px-3 py-1.5 rounded shadow-sm group-hover:scale-105 transition-all shrink-0 whitespace-nowrap" data-i18n="goToToken">Ir al Token 🚀</span>
            </a>

            <!-- 3. GRÁFICA DE VELAS EN VIVO (MÁS GRANDE) -->
            <div class="w-full clean-card rounded-lg p-2 shadow-sm">
                <div class="flex justify-between items-center border-b border-cyan-500/10 pb-1 mb-1.5">
                    <h2 class="text-cyan-400 font-bold text-[11px] flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                        <span data-i18n="liveChartTitle">Gráfica / Velas en Vivo</span>
                    </h2>
                    <span class="text-[9px] text-green-400 bg-green-950/40 border border-green-500/30 px-1.5 py-0.2 rounded font-medium" data-i18n="synced">● Sincronizado</span>
                </div>
                <div class="w-full h-[410px] rounded overflow-hidden border border-cyan-500/20 bg-black">
                    <iframe id="dexscreener-iframe" src="" width="100%" height="100%" style="border:0;"></iframe>
                </div>
            </div>

            <!-- 4. COMPRAS Y VENTAS EN VIVO -->
            <div class="w-full clean-card rounded-lg p-2 shadow-sm">
                <div class="flex justify-between items-center border-b border-cyan-500/10 pb-1 mb-1.5">
                    <h3 class="text-cyan-400 font-bold text-[11px] uppercase tracking-wide flex items-center gap-1">
                        <span>📊</span> <span data-i18n="ordersTitle">Compras y Ventas en Vivo</span>
                    </h3>
                    <span class="text-[9px] text-green-400 bg-green-950/40 border border-green-500/30 px-1.5 py-0.2 rounded font-medium animate-pulse" data-i18n="liveStatus">● En Vivo</span>
                </div>
                
                <a id="dexscreener-stream-link" href="#" target="_blank" class="w-full bg-black/60 border border-cyan-500/20 hover:border-cyan-400 rounded-lg flex items-center justify-between p-2 group transition-all text-left">
                    <span class="text-gray-300 text-[11px] font-medium group-hover:text-cyan-200" data-i18n="dexscreenerAction">Ver historial detallado de transacciones</span>
                    <span class="text-cyan-400 text-[10px] font-bold group-hover:translate-x-0.5 transition-transform">Abrir Feed 📈</span>
                </a>
            </div>

            <!-- Pie de página -->
            <footer class="w-full text-center text-[9px] text-gray-500 border-t border-cyan-500/10 pt-1.5 flex justify-between items-center">
                <span>TRAKER ZARD &copy; 2026</span>
                <span class="text-cyan-500/70 font-mono">Secure Environment</span>
            </footer>

        </div>
    </div>

    <script>
        const translations = {
            es: {
                mainTitle: "TRAKER ZARD",
                mainSubtitle: "Monitoreo On-Chain - Ecosistema ZAARD",
                liveChartTitle: "Gráfica / Velas en Vivo",
                synced: "● Sincronizado",
                officialToken: "Token Oficial ZARD",
                goToToken: "Ir al Token 🚀",
                ordersTitle: "Compras y Ventas en Vivo",
                liveStatus: "● En Vivo",
                dexscreenerAction: "Ver historial detallado de transacciones"
            },
            en: {
                mainTitle: "TRAKER ZARD",
                mainSubtitle: "On-Chain Monitoring - ZAARD Ecosystem",
                liveChartTitle: "Live Chart / Candles",
                synced: "● Synced",
                officialToken: "Official ZARD Token",
                goToToken: "Go to Token 🚀",
                ordersTitle: "Live Buys & Sells",
                liveStatus: "● Live",
                dexscreenerAction: "View detailed transaction history"
            },
            ar: {
                mainTitle: "تراكر زارد",
                mainSubtitle: "مراقبة سلسة - نظام زارد",
                liveChartTitle: "الرسم البياني المباشر",
                synced: "● متزامن",
                officialToken: "رمز زارد الرسمي",
                goToToken: "اذهب إلى الرمز 🚀",
                ordersTitle: "المشتريات والمبيعات المباشرة",
                liveStatus: "● مباشر",
                dexscreenerAction: "عرض سجل المعاملات المفصل"
            },
            zh: {
                mainTitle: "扎ード トラッカー",
                mainSubtitle: "链上监控 - 扎ード生态系统",
                liveChartTitle: "实时图表 / K线",
                synced: "● 已同步",
                officialToken: "官方代币 ZARD",
                goToToken: "前往代币 🚀",
                ordersTitle: "实时买卖单",
                liveStatus: "● 实时",
                dexscreenerAction: "查看详细交易历史"
            }
        };

        function changeLanguage(lang) {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            if (lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
            }

            ['es', 'en', 'ar', 'zh'].forEach(l => {
                const btn = document.getElementById(`btn-${l}`);
                if (btn) {
                    if (l === lang) {
                        btn.className = "flex items-center gap-1 px-2 py-0.5 text-[11px] font-bold rounded transition-all bg-cyan-500 text-black";
                    } else {
                        btn.className = "flex items-center gap-1 px-2 py-0.5 text-[11px] font-bold rounded transition-all text-gray-400 hover:text-white bg-transparent";
                    }
                }
            });

            localStorage.setItem('zaard_lang', lang);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('zaard_lang') || 'es';
            changeLanguage(savedLang);
        });

        const ZARD_CONTRACT = "0x5cac292558049638f39fb492e70fdbf3c4f5eb4e";
        const PANCAKE_POOL = "0x5cac292558049638f39fb492e70fdbf3c4f5eb4e";

        document.getElementById('token-link').href = `https://app.binance.com/uni-qr/web3-token-details?utm_medium=share&tokenCA=${ZARD_CONTRACT}&binanceChainId=56&chain=bsc`;
        document.getElementById('dexscreener-iframe').src = `https://dexscreener.com/bsc/${PANCAKE_POOL}?embed=1&theme=dark&trades=1&info=0`;
        document.getElementById('dexscreener-stream-link').href = `https://dexscreener.com/bsc/${PANCAKE_POOL}`;
    </script>
</body>
</html>
